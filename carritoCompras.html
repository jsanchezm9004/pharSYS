<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pharSYS | Carrito</title>
    <link rel="stylesheet" href="farmacia-hu01/css/navegacion.css" />
    <link rel="stylesheet" href="estiloCarrito.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand" aria-label="pharSYS">
          <img src="imagenes/logo-sin-fondo.png" alt="Logo de pharSYS" />
          <div class="brand-copy">
            <span class="brand-phar">phar</span><span class="brand-sys">SYS</span>
          </div>
        </div>

        <div class="pharsys-menu-root" data-base="farmacia-hu01/" data-current="cart" data-layout="inline"></div>

        <div class="topbar-actions">
          <button class="icon-button cart-button" aria-label="Carrito">
            🛒
            <span class="cart-count">0</span>
          </button>
        </div>
      </header>

      <main class="cart-page">
        <section class="cart-panel" aria-label="Productos del carrito">
          <div class="section-header">
            <div>
              <p class="eyebrow">Mi compra</p>
              <h1>Carrito de compras</h1>
            </div>
            <a href="farmacia-hu01/index.html" class="secondary-link">Seguir comprando</a>
          </div>

          <div id="listaCarrito" aria-live="polite"></div>
        </section>

        <aside class="summary-panel" aria-label="Resumen del pedido">
          <div class="summary-card">
            <h3>Resumen</h3>

            <div class="summary-row">
              <span>Subtotal</span>
              <strong id="subtotal">$0.00</strong>
            </div>
            <div class="summary-row">
              <span>Envío</span>
              <strong id="shipping">$0.00</strong>
            </div>
            <div class="summary-row discount">
              <span>Descuento</span>
              <strong id="discount">-$0.00</strong>
            </div>

            <div class="summary-total">
              <span>Total</span>
              <strong id="total">$0.00</strong>
            </div>

            <p class="items-count"><span id="item-count">0</span> artículos</p>

            <button type="button" id="checkoutButton" class="primary-button">Proceder al pago</button>
            <p id="cartLoginWarning" class="cart-login-warning" hidden>Debes iniciar sesión para continuar con el pago.</p>
            <button type="button" class="secondary-button">Guardar carrito</button>
          </div>
        </aside>
      </main>
    </div>

    <script src="farmacia-hu01/js/navegacion.js"></script>
    <script src="farmacia-hu01/js/productos.js"></script>
    <script src="farmacia-hu01/js/carrito.js"></script>
    <script>
      const moneda = new Intl.NumberFormat("es-CO", {
        style: "currency",
        currency: "COP",
        maximumFractionDigits: 0
      });

      function actualizarResumenCarrito() {
        const carrito = leerCarrito();
        const items = carrito
          .map(item => {
            const producto = productos.find(p => p.id === item.id);
            if (!producto) return null;
            return { ...producto, cantidad: item.cantidad };
          })
          .filter(Boolean);

        const subtotal = items.reduce((total, item) => total + Number(item.precio || 0) * item.cantidad, 0);
        const shipping = items.length ? 12000 : 0;
        const descuento = items.length ? (subtotal > 200000 ? subtotal * 0.1 : 0) : 0;
        const total = subtotal + shipping - descuento;
        const cantidadTotal = items.reduce((totalCantidad, item) => totalCantidad + item.cantidad, 0);

        document.getElementById("subtotal").textContent = moneda.format(subtotal);
        document.getElementById("shipping").textContent = moneda.format(shipping);
        document.getElementById("discount").textContent = `-${moneda.format(descuento)}`;
        document.getElementById("total").textContent = moneda.format(total);
        document.getElementById("item-count").textContent = cantidadTotal;
        document.querySelector(".cart-count").textContent = cantidadTotal;

        const aviso = document.getElementById("cartLoginWarning");
        if (aviso) {
          try {
            const sesion = JSON.parse(localStorage.getItem("pharsysSesion") || "null");
            aviso.hidden = Boolean(sesion);
          } catch (error) {
            aviso.hidden = false;
          }
        }
      }

      function requiereSesionParaPago() {
        const loginRedirect = window.location.pathname.includes("/farmacia-hu01/")
          ? "../login/index.html"
          : "farmacia-hu01/login/index.html";

        try {
          const sesion = JSON.parse(localStorage.getItem("pharsysSesion") || "null");
          if (!sesion) {
            window.location.replace(loginRedirect);
            return false;
          }
          return true;
        } catch (error) {
          window.location.replace(loginRedirect);
          return false;
        }
      }

      document.getElementById("checkoutButton").addEventListener("click", () => {
        if (!requiereSesionParaPago()) return;
        window.location.href = "checkout.html";
      });

      window.addEventListener("pharsys:cart-updated", () => {
        if (typeof pintarCarrito === "function") {
          pintarCarrito();
        }
        actualizarResumenCarrito();
      });

      if (typeof pintarCarrito === "function") {
        pintarCarrito();
      }
      actualizarResumenCarrito();
    </script>
  </body>
</html>
